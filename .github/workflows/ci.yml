name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend-quality

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy app tests

      - name: Run unit tests
        run: uv run pytest

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: agente_fitness_ci
      POSTGRES_USER: agente_fitness_ci
      POSTGRES_PASSWORD: ci_ephemeral_password_only
      DATABASE_URL: postgresql+psycopg://agente_fitness_ci:ci_ephemeral_password_only@127.0.0.1:5432/agente_fitness_ci
      DATABASE_CONNECT_TIMEOUT_SECONDS: "3"
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-ephemeral-jwt-secret-only-for-this-workflow
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: agente_fitness_ci
          POSTGRES_USER: agente_fitness_ci
          POSTGRES_PASSWORD: ci_ephemeral_password_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agente_fitness_ci -d agente_fitness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: postgres-integration

      - name: Install locked dependencies
        working-directory: backend
        shell: bash
        run: uv sync --locked

      - name: Validate Docker Compose
        shell: bash
        run: docker compose --env-file .env.example config --quiet

      - name: Wait for PostgreSQL
        shell: bash
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER_ID" \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "PostgreSQL did not become ready after 30 attempts."
              docker logs "$POSTGRES_CONTAINER_ID" || true
              exit 1
            fi

            sleep 1
          done

      - name: Validate Alembic migrations
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current --check-heads

      - name: Run PostgreSQL integration tests
        working-directory: backend
        shell: bash
        run: uv run pytest integration_tests -m integration

      - name: Verify API contracts
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          server_log="${RUNNER_TEMP}/uvicorn.log"
          uv run uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            --no-access-log >"$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            exit_code=$?
            trap - EXIT

            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true

            if [[ "$exit_code" -ne 0 ]]; then
              echo "Uvicorn log:"
              sed -n '1,200p' "$server_log"
            fi

            exit "$exit_code"
          }
          trap cleanup EXIT

          server_started=false
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Uvicorn stopped before becoming available."
              exit 1
            fi

            if status_code="$(
              curl --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 2 \
                http://127.0.0.1:8000/health
            )" && [[ "$status_code" == "200" ]]; then
              server_started=true
              break
            fi

            sleep 1
          done

          if [[ "$server_started" != "true" ]]; then
            echo "Uvicorn did not become available after 30 attempts."
            exit 1
          fi

          assert_contract() {
            endpoint=$1
            expected_body=$2
            response_file="${RUNNER_TEMP}/${endpoint}.json"

            if ! status_code="$(
              curl --silent \
                --show-error \
                --output "$response_file" \
                --write-out "%{http_code}" \
                --max-time 5 \
                "http://127.0.0.1:8000/${endpoint}"
            )"; then
              echo "Request to /${endpoint} failed."
              exit 1
            fi

            actual_body="$(tr -d '\r\n' <"$response_file")"
            if [[ "$status_code" != "200" || "$actual_body" != "$expected_body" ]]; then
              echo "Unexpected contract for /${endpoint}: HTTP ${status_code}."
              printf "Response body: %s\n" "$actual_body"
              exit 1
            fi
          }

          assert_contract health '{"status":"ok"}'
          assert_contract ready '{"status":"ready"}'
